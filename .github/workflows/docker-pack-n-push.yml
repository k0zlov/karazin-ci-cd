name: Docker pack and push

on:
  workflow_call:
    inputs:
      repository:
        description: Docker Hub repository including namespace
        required: true
        type: string
      tag:
        description: Docker image tag
        required: false
        default: latest
        type: string
      context:
        description: Docker build context relative to the workspace root
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile path relative to the workspace root
        required: false
        default: karazin_ci_cd_server/Dockerfile
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub login; needed only for main publication
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub token with repository write access; needed only for main
        required: false

permissions:
  contents: read

jobs:
  docker-pack-n-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.repository }}:${{ inputs.tag }}
      IMAGE_REPOSITORY: ${{ inputs.repository }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      BUILD_CONTEXT: ${{ inputs.context }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check repository configuration
        run: |
          if [ -z "$IMAGE_REPOSITORY" ]; then
            echo 'Set the Actions repository variable DOCKERHUB_REPOSITORY to <namespace>/karazin-ci-cd.' >&2
            exit 1
          fi

      - name: Check publication credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets.' >&2
            exit 1
          fi

      - name: Build and tag Docker image
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE" "$BUILD_CONTEXT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"

      - name: Export Docker image for non-main branches
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: docker save "$IMAGE" | gzip > "$RUNNER_TEMP/image.tar.gz"

      - name: Upload Docker image artifact
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
