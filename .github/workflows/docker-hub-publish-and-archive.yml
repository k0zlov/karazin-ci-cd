name: Publish to Docker Hub and archive in GitHub Actions

on:
  workflow_call:
    inputs:
      repository:
        description: Docker Hub repository including namespace
        required: true
        type: string
      tag:
        description: Docker image tag
        required: false
        default: latest
        type: string
      context:
        description: Docker build context relative to the workspace root
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile path relative to the workspace root
        required: false
        default: karazin_ci_cd_server/Dockerfile
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub login; needed only for main publication
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub token with repository write access; needed only for main
        required: false

permissions:
  contents: read

jobs:
  docker-pack-n-push:
    name: Build and distribute Docker image
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.repository }}:${{ inputs.tag }}
      SHA_IMAGE: ${{ inputs.repository }}:sha-${{ github.sha }}
      IMAGE_REPOSITORY: ${{ inputs.repository }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      BUILD_CONTEXT: ${{ inputs.context }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check repository configuration
        run: |
          if [ -z "$IMAGE_REPOSITORY" ]; then
            echo 'Set the Actions repository variable DOCKERHUB_REPOSITORY to <namespace>/karazin-ci-cd.' >&2
            exit 1
          fi

      - name: Check publication credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets.' >&2
            exit 1
          fi

      - name: Build and tag Docker image
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE" --tag "$SHA_IMAGE" "$BUILD_CONTEXT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish to Docker Hub (${{ inputs.repository }})
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$SHA_IMAGE"
          docker push "$IMAGE"

      - name: Create image archive
        id: archive
        shell: bash
        run: |
          archive_name="${IMAGE_REPOSITORY##*/}-docker-image"
          docker save "$IMAGE" "$SHA_IMAGE" | gzip > "$RUNNER_TEMP/$archive_name.tar.gz"
          printf 'name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"

      - name: Save archive to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.archive.outputs.name }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
