# Run from this server directory: docker compose up --build -d
name: karazin-ci-cd

services:
  postgres:
    image: ghcr.io/serverpod/postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: karazin_ci_cd
      POSTGRES_PASSWORD: ${SERVERPOD_DATABASE_PASSWORD:-karazin-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: karazin_ci_cd_server/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--apply-migrations"]
    environment:
      runmode: production
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: karazin_ci_cd
      SERVERPOD_DATABASE_USER: postgres
      SERVERPOD_DATABASE_PASSWORD: ${SERVERPOD_DATABASE_PASSWORD:-karazin-local-only}
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      SERVERPOD_WEB_SERVER_PUBLIC_HOST: localhost
      SERVERPOD_WEB_SERVER_PUBLIC_PORT: "8082"
      SERVERPOD_WEB_SERVER_PUBLIC_SCHEME: http
      SERVERPOD_SESSION_CONSOLE_LOG_ENABLED: "true"

volumes:
  postgres_data:
