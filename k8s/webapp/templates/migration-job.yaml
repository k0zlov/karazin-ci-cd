apiVersion: batch/v1
kind: Job

metadata:
  name: {{ .Release.Name }}-migration

spec:
  backoffLimit: 6

  template:
    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
          args:
            - >-
              until pg_isready
              -h {{ .Release.Name }}-postgres
              -p {{ .Values.postgres.service.port }}
              -U {{ .Values.postgres.user }};
              do sleep 2; done

      containers:
        - name: migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}

          args:
            - --mode
            - production

          env:
            - name: runmode
              value: production

            - name: SERVERPOD_DATABASE_HOST
              value: "{{ .Release.Name }}-postgres"

            - name: SERVERPOD_DATABASE_PORT
              value: {{ .Values.postgres.service.port | quote }}

            - name: SERVERPOD_DATABASE_NAME
              value: {{ .Values.postgres.database | quote }}

            - name: SERVERPOD_DATABASE_USER
              value: {{ .Values.postgres.user | quote }}

            - name: SERVERPOD_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: password

            - name: SERVERPOD_DATABASE_REQUIRE_SSL
              value: "false"
