images:
  repository: ""
  pullSecrets: []

backend:
  image:
    repository: ""
    tag: latest
    digest: ""
    pullPolicy: Always
  replicas: 1
  containerPort: 8082
  servicePort: 8082
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

frontend:
  image:
    repository: ""
    tag: latest
    digest: ""
    pullPolicy: Always
  replicas: 1
  servicePort: 80
  apiBaseUrl: ""
  resources:
    requests:
      cpu: 25m
      memory: 24Mi
    limits:
      memory: 128Mi

postgresql:
  image: postgres:16-alpine
  imagePullPolicy: IfNotPresent
  name: karazin_ci_cd
  user: postgres
  port: 5432
  existingSecret: karazin-db
  passwordKey: password
  storage:
    size: 1Gi
    className: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 384Mi

migrations:
  image:
    repository: ""
    tag: latest
    digest: ""
    pullPolicy: Always
  backoffLimit: 2
  deadlineSeconds: 240
  waitImage: alpine/kubectl:1.34.2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

ingress:
  enabled: true
  className: traefik
  host: localhost
  publicScheme: http
  publicPort: 18080
  annotations: {}
  tlsSecretName: ""
