{{- $postgres := dict "root" . "component" "postgres" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "karazin.name" $postgres }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.postgresql.port }}
      targetPort: postgres
  selector:
    {{- include "karazin.selector" $postgres | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "karazin.name" $postgres }}
spec:
  serviceName: {{ include "karazin.name" $postgres }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "karazin.selector" $postgres | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karazin.selector" $postgres | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.imagePullPolicy }}
          args: ["-p", {{ .Values.postgresql.port | quote }}]
          ports:
            - name: postgres
              containerPort: {{ .Values.postgresql.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_PASSWORD
              {{- include "karazin.password" . | nindent 14 }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -h 127.0.0.1 -p {{ .Values.postgresql.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -h 127.0.0.1 -p {{ .Values.postgresql.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storage.className }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size | quote }}
