{{- $backend := dict "root" . "component" "backend" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "karazin.name" $backend }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karazin.name" $backend }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: [{{ include "karazin.migrationName" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "karazin.name" $backend }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "karazin.name" $backend }}
subjects:
  - kind: ServiceAccount
    name: {{ include "karazin.name" $backend }}
    namespace: {{ .Release.Namespace }}
